      <h1>Web Explorer - Open & Preview Any File in Your Browser</h1>
      <p>Web Explorer is a free, private online file viewer that lets you open and preview over 100 file formats directly in your browser. No file uploads, no server processing — everything runs locally on your device.</p>
      <h2>Supported File Formats</h2>
      <ul>
        <li><strong>Documents:</strong> PDF, DOCX, PPTX, XLSX, ODT, ODS, ODP</li>
        <li><strong>Images:</strong> PNG, JPG, JPEG, GIF, BMP, SVG, WebP, ICO, TIFF</li>
        <li><strong>Videos:</strong> MP4, WebM, MKV, AVI, MOV</li>
        <li><strong>Audio:</strong> MP3, WAV, FLAC, OGG, AAC, MIDI</li>
        <li><strong>Code:</strong> JS, TS, Python, Java, C, C++, HTML, CSS, JSON, XML, YAML, and more</li>
        <li><strong>Archives:</strong> ZIP, TAR, GZ, 7Z, RAR, BZ2</li>
        <li><strong>Ebooks:</strong> EPUB, MOBI</li>
        <li><strong>3D Models:</strong> STL, OBJ, GLTF, GLB, FBX</li>
        <li><strong>Databases:</strong> SQLite</li>
        <li><strong>Fonts:</strong> TTF, OTF, WOFF, WOFF2</li>
        <li><strong>Torrents:</strong> .torrent files</li>
        <li><strong>Guitar Tabs:</strong> GP3, GP4, GP5, GPX</li>
      </ul>
      <h2>Privacy First</h2>
      <p>All file processing happens entirely in your browser using WebAssembly and JavaScript. Your files never leave your device.</p>
    </main>
